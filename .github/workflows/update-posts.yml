name: Update RookieOps posts

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-rookieops-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate static post cards
        run: node scripts/update-posts.mjs

      - name: Commit changes when the feed changed
        run: |
          if git diff --quiet -- index.html en/index.html assets/data/posts.json sitemap.xml; then
            echo "No new posts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html assets/data/posts.json sitemap.xml
          git commit -m "Atualiza posts do RookieOps"
          git push

  notify:
    name: Notify workflow result
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create, update, or close the failure alert
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- update-rookieops-workflow-alert -->";
            const issueTitle = "[Alert] RookieOps post update failed";
            const result = "${{ needs.update.result }}";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                ...context.repo,
                state: "open",
                per_page: 100
              }
            );
            const alertIssue = openIssues.find(
              (issue) =>
                !issue.pull_request &&
                issue.title === issueTitle &&
                issue.body?.includes(marker)
            );

            if (result === "failure") {
              const failureBody = [
                marker,
                "The RookieOps post update workflow failed.",
                "",
                `- Run: [#${context.runNumber} (attempt ${context.runAttempt})](${runUrl})`,
                `- Event: \`${context.eventName}\``,
                `- Commit: \`${context.sha.slice(0, 7)}\``
              ].join("\n");

              if (alertIssue) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: alertIssue.number,
                  body: failureBody
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title: issueTitle,
                  body: failureBody,
                  assignees: [context.repo.owner]
                });
              }
              return;
            }

            if (result === "success" && alertIssue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: alertIssue.number,
                body: `The workflow recovered successfully in [run #${context.runNumber}](${runUrl}).`
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: alertIssue.number,
                state: "closed",
                state_reason: "completed"
              });
            }
