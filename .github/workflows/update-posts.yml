name: Update RookieOps posts

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rookieops-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate static post cards
        run: node scripts/update-posts.mjs

      - name: Commit changes when the feed changed
        run: |
          if git diff --quiet -- index.html en/index.html assets/data/posts.json sitemap.xml; then
            echo "No new posts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html assets/data/posts.json sitemap.xml
          git commit -m "Atualiza posts do RookieOps"
          git push
